name: Build SnowWardenPet

on:
  workflow_dispatch:
  push:
    paths:
      - "SnowWardenPet-1.0.0-source.zip"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Extract source
        run: |
          unzip -o SnowWardenPet-1.0.0-source.zip
          cp -r snowwarden/. .
          rm -rf snowwarden

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fix Paper 26.2 API
        run: |
          sed -i 's/26\.2\.build\.112/26.2.build.129-stable/g' build.gradle.kts
          python3 - <<'PY'
          from pathlib import Path

          p = Path("src/main/java/com/snowmcp/wardenpet/SnowWardenPet.java")
          s = p.read_text()

          old = '        meta.displayName(org.bukkit.ChatColor.translateAlternateColorCodes(\'&\', getConfig().getString("pet.name", "&5&lWarden Pet")));'
          new = '        meta.displayName(net.kyori.adventure.text.serializer.legacy.LegacyComponentSerializer.legacyAmpersand().deserialize(getConfig().getString("pet.name", "&5&lWarden Pet")));'

          if old not in s:
              raise SystemExit("Could not find the old displayName line.")

          p.write_text(s.replace(old, new))
          PY

      - name: Build
        run: |
          gradle build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: SnowWardenPet
          path: build/libs/SnowWardenPet-1.0.0.jar
