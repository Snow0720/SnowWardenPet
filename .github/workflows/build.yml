name: Build SnowWardenPet

on:
  workflow_dispatch:
  push:
    paths:
      - "SnowWardenPet-1.0.0-source.zip"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Extract source
        run: |
          unzip -o SnowWardenPet-1.0.0-source.zip
          cp -r snowwarden/. .
          rm -rf snowwarden

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          sed -i 's/26\.2\.build\.112/26.2.build.129/g' build.gradle.kts
          gradle build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: SnowWardenPet
          path: build/libs/SnowWardenPet-1.0.0.jar
